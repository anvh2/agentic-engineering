name: Post-merge smoke and E2E

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postmerge-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke-e2e:
    name: Full smoke / E2E safety gate
    uses: ./.github/workflows/validation.yml
    with:
      test-lane: full
