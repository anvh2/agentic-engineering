name: Validation

on:
  workflow_call:
    inputs:
      full-regression:
        description: "Run full Node regression on macOS"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  static:
    name: Install and typecheck (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Typecheck all project TypeScript
        run: npm run typecheck

  regression:
    name: Full project tests (macOS, Node 22)
    if: inputs.full-regression
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Install Go toolchain for verifier and sandbox tests
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.2"
          cache: false
      - name: Check Go toolchain
        run: go version
      - name: Install pinned dependencies
        run: npm ci
      - name: Full project test suite
        run: npm test
