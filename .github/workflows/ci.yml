name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    name: Project checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend
        working-directory: app/frontend
        run: |
          npm install
          npm run typecheck
          npm run build
      - name: Go checks
        working-directory: app
        env:
          GOTOOLCHAIN: local
        run: |
          go vet ./...
          go test -race ./...
          go build ./...
